[Service]
# Expose only the PDF subtree inside the API namespace; canonical JSON, receipts,
# backups and authority policy remain outside the API's readable paths.
BindReadOnlyPaths=/srv/study/workshop/mpsc-question-bankv2/pdfs:/srv/study/private/pdf-library/archive
Environment=PDF_LIBRARY_ARCHIVE_ROOT=/srv/study/private/pdf-library/archive
