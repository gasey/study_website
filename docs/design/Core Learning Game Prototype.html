        frame_puanchei: false,
        desk_bamboo: false
      },
      rewardToast: null
    };

    let timerHandle = null;

    // Level curve from api/app/services/learning_rewards.py: level = max(1, floor(sqrt(xp / 40)))
    function computeLevelBounds(xp) {
      const safeXp = Math.max(0, xp);
      const level = Math.max(1, Math.floor(Math.sqrt(safeXp / 40)));
      const levelFloor = level === 1 ? 0 : 40 * level * level;
      const nextLevelXp = 40 * (level + 1) * (level + 1);
      const pct = Math.min(100, Math.round(((safeXp - levelFloor) / (nextLevelXp - levelFloor)) * 100));
      const titles = {
        1: "Foundation Novice", 2: "Foundation Novice",
        3: "Chaltlang Cadet", 4: "Chaltlang Cadet",
        5: "Aizawl Core Scholar", 6: "Aizawl Core Scholar", 7: "Aizawl Core Scholar",
        8: "Secretariat Fellow", 9: "Secretariat Fellow", 10: "Secretariat Fellow", 11: "Secretariat Fellow"
      };
      return {
        level,
        levelFloor,
        nextLevelXp,
        xpToNext: Math.max(0, nextLevelXp - safeXp),
        pct,
        title: titles[level] || "MPSC Common Core Master"
      };
    }

    function currentQuestion() {
      return REAL_QUESTIONS[state.currentIndex] || REAL_QUESTIONS[0];
    }

    function effectiveRoundSeconds(q) {
      if (q.pillar === "everyday_math") {
        return STREAM_PRESETS[state.presetId].mathSeconds;
      }
      return q.roundSeconds;
    }

    function startTimer() {
      clearInterval(timerHandle);
      const q = currentQuestion();
      state.timerRemaining = effectiveRoundSeconds(q);
      timerHandle = setInterval(() => {
        if (state.screen !== "play" || state.phase !== "question") return;
        if (state.timerRemaining > 0) {
          state.timerRemaining--;
          const el = document.getElementById("live-timer-val");
          if (el) el.textContent = state.timerRemaining + "s";
        } else {
          submitAnswer(null);
        }
      }, 1000);
    }

    function setViewport(vp) {
      state.viewport = vp;
      render();
    }

    function setScreen(scr) {
      state.screen = scr;
      if (scr === "play" && state.phase === "question") {
        startTimer();
      }
      render();
    }

    function selectPreset(id) {
      state.presetId = id;
      render();
    }

    function startCircuitRun() {
      state.currentIndex = 0;
      state.stones = [];
      state.currentStreak = 0;
      state.bestStreak = 0;
      state.doubleNextArmed = false;
      state.doubleUsedOn = null;
      state.phase = "question";
      state.chosenIndex = null;
      const q = currentQuestion();
      state.conceptLensOpen = false;
      state.scratchpadOpen = q.pillar === "everyday_math";
      state.scratchpadText = q.scratchpadSteps ? q.scratchpadSteps.join("\n") : "";
      setScreen("play");
    }

    function jumpToStone(idx) {
      state.currentIndex = idx;
      const existing = state.stones.find(s => s.position === idx);
      const q = currentQuestion();
      if (existing) {
        state.phase = "feedback";
        state.chosenIndex = existing.chosenIndex;
      } else {
        state.phase = "question";
        state.chosenIndex = null;
        state.conceptLensOpen = false;
        state.scratchpadOpen = q.pillar === "everyday_math";
        state.scratchpadText = q.scratchpadSteps ? q.scratchpadSteps.join("\n") : "";
        startTimer();
      }
      render();
    }

    // Competitive Task-Normalized Scoring Engine
    function submitAnswer(optIdx) {
      if (state.phase !== "question") return;
      clearInterval(timerHandle);
      const q = currentQuestion();
      const roundSecs = effectiveRoundSeconds(q);
      const correct = optIdx !== null && optIdx === q.answerIndex;
      const boosted = state.doubleUsedOn === state.currentIndex;

      // Clock saved ratio (0.0 to 1.0) - Task-Normalized so 45s Maths and 20s GK are equally rewarded!
      const clockSavedRatio = Math.max(0, Math.min(1, state.timerRemaining / roundSecs));
      const clockSavedPct = Math.round(clockSavedRatio * 100);

      let basePts = 0;
      let pacePts = 0;
      let streakPts = 0;
      let couragePts = 0;
      let totalPts = 0;
      let xpEarned = 0;
      let walletPtEarned = 0;

      if (correct) {
        state.currentStreak++;
        if (state.currentStreak > state.bestStreak) state.bestStreak = state.currentStreak;

        basePts = 100;
        pacePts = Math.floor(50 * clockSavedRatio);
        if (boosted) {
          basePts *= 2;
          pacePts *= 2;
        }

        // Streak Combo Bonus
        if (state.currentStreak === 2) streakPts = 15;
        else if (state.currentStreak === 3) streakPts = 30;
        else if (state.currentStreak === 4) streakPts = 40;
        else if (state.currentStreak >= 5) streakPts = 50;

        // Cross-Stream Courage Bonus (+25 pts when answering outside comfort stream without hint)
        const preset = STREAM_PRESETS[state.presetId];
        if (preset.couragePillar === q.pillar && !state.conceptLensOpen) {
          couragePts = 25;
        }

        totalPts = basePts + pacePts + streakPts + couragePts;

        // First-time canonical correct reward (+10 XP & +1 Wallet Point under 300 XP daily cap)
        if (state.dailyBaseXp < 300) {
          xpEarned = 10;
          walletPtEarned = 1;
          state.dailyBaseXp = Math.min(300, state.dailyBaseXp + 10);
          state.lifetimeXp += 10;
          state.walletPoints += 1;
          // Sync with leaderboard 'You' entry
          const youRow = LEADERBOARD_PLAYERS.find(p => p.isYou);
          if (youRow) {
            youRow.weeklyXp += 10;
            youRow.monthlyXp += 10;
            youRow.allXp += 10;
          }
        }
      } else {
        state.currentStreak = 0;
      }

      state.chosenIndex = optIdx;
      state.phase = "feedback";
      state.stones = state.stones.filter(s => s.position !== state.currentIndex);
      state.stones.push({
        position: state.currentIndex,
        id: q.id,
        pillar: q.pillar,
        chosenIndex: optIdx,
        correct,
        basePts,
        pacePts,
        streakPts,
        couragePts,
        points: totalPts,
        clockSavedPct,
        boosted,
        xpEarned,
        walletPtEarned,
        streakAtStone: state.currentStreak
      });
      render();
    }

    function nextStone() {
      if (state.currentIndex + 1 >= REAL_QUESTIONS.length) {
        setScreen("finish");
        return;
      }
      state.currentIndex++;
      if (state.doubleNextArmed && state.doubleUsedOn === null) {
        state.doubleUsedOn = state.currentIndex;
        state.doubleNextArmed = false;
      }
      const q = currentQuestion();
      state.phase = "question";
      state.chosenIndex = null;
      state.conceptLensOpen = false;
      state.scratchpadOpen = q.pillar === "everyday_math";
      state.scratchpadText = q.scratchpadSteps ? q.scratchpadSteps.join("\n") : "";
      startTimer();
      render();
    }

    function toggleDoubleNext() {
      if (state.doubleUsedOn !== null) return;
      state.doubleNextArmed = !state.doubleNextArmed;
      render();
    }

    function toggleConceptLens() {
      state.conceptLensOpen = !state.conceptLensOpen;
      render();
    }

    function toggleScratchpad() {
      state.scratchpadOpen = !state.scratchpadOpen;
      render();
    }

    function toggleRevisionSave(qid) {
      state.savedForRevision[qid] = !state.savedForRevision[qid];
      render();
    }

    function totalScore() {
      return state.stones.reduce((acc, s) => acc + s.points, 0) || 345; // Default display score before first stone
    }

    function actualRunScore() {
      return state.stones.reduce((acc, s) => acc + s.points, 0);

    function claimDailyQuest(qKey) {
      const q = state.quests[qKey];

      q.claimed = true;

      const youRow = LEADERBOARD_PLAYERS.find(p => p.isYou);
      if (youRow) {

        youRow.monthlyXp += q.xp;
        youRow.allXp += q.xp;

      state.rewardToast = `Claimed ${q.title}: +${q.xp} XP & +${q.pts} Spendable Points added to your wallet!`;
      render();
    }

    function buyStreakShield() {
      if (state.streakShields >= 2) {

      if (state.walletPoints < 25) {

        render();
        return;
      }
      state.walletPoints -= 25;
      state.streakShields++;
      state.rewardToast = "Equipped +1 Streak Shield (-25 Points). Your XP & Leaderboard Rank are unchanged!";
      render();
    }

    function redeemPro7Days() {
      if (state.walletPoints < 1000) {
        state.rewardToast = `You have ${state.walletPoints} / 1,000 Points. Claim today's Daily Quest chests or play a circuit to reach 1,000!`;
        render();

      state.walletPoints -= 1000;

                  <p class="text-xs text-[#49443B] mt-0.5">Clearing 5 items in /revision completes Ring 3 of your Daily Quests (+50 XP & +5 Points).</p>
                </div>
                <span class="ism-mono text-xs text-[#1F44A6] font-semibold">/revision?exam_scope=mizoram-recruitment</span>
              </div>
            </div>

            <!-- All 10 Real Questions Source Review -->
            <h2 class="ism-display text-2xl mt-6 mb-3">Complete Source & Official Key Review</h2>
            <div class="divide-y divide-[#E4DBC9]">
              ${REAL_QUESTIONS.map((q, idx) => {
                const s = state.stones.find(x => x.position === idx);
                return `
                  <details class="py-3 group">
                    <summary class="min-h-11 cursor-pointer flex flex-wrap items-center justify-between gap-2 text-sm font-medium">
                      <div class="flex items-center gap-2.5">
                        <span class="ism-mono text-xs px-2 py-0.5 rounded ${q.chipClass}">${idx + 1}. ${q.topicLabel}</span>
                        <span>${q.question}</span>
                      </div>
                      <span class="ism-mono text-xs ${s ? (s.correct ? 'text-[#3D7344] font-semibold' : 'text-[#B0412A] font-semibold') : 'text-[#6B6457]'}">
                        ${s ? (s.correct ? `✓ +${s.points} pts` : '↻ Revise') : 'Inspect key'}
                      </span>
                    </summary>
                    <div class="mt-2 pl-3 border-l-2 border-[#DCD3C2] text-xs space-y-1.5 text-[#49443B]">
                      <div><strong>Official Key:</strong> <span class="text-[#3D7344] font-semibold">${String.fromCharCode(65 + q.answerIndex)}. ${q.options[q.answerIndex]}</span> · Source: ${q.exam} (Q${q.qnum}, p.${q.page})</div>
                      <div>${q.explanation}</div>
                    </div>
                  </details>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderMobileBottomBar() {
      return `
        <nav aria-label="Mobile bottom navigation" class="sticky bottom-0 z-20 border-t border-[#DCD3C2] bg-[#FFFFFF] px-1.5 py-1.5 grid grid-cols-5 text-center text-xs">
          <button type="button" onclick="setScreen('setup')" class="min-h-11 flex flex-col items-center justify-center ${state.screen === 'setup' ? 'text-[#1D1B18] font-bold' : 'text-[#6B6457]'}">
            <span>⌂</span><span>Setup</span>
          </button>
          <button type="button" onclick="setScreen('play')" class="min-h-11 flex flex-col items-center justify-center ${state.screen === 'play' ? 'text-[#2D5BD0] font-bold' : 'text-[#6B6457]'}">
            <span>↟</span><span>Circuit</span>
          </button>
          <button type="button" onclick="setScreen('duel')" class="min-h-11 flex flex-col items-center justify-center ${state.screen === 'duel' ? 'text-[#33609E] font-bold' : 'text-[#6B6457]'}">
            <span>⚔</span><span>Duel</span>
          </button>
          <button type="button" onclick="setScreen('leaderboard')" class="min-h-11 flex flex-col items-center justify-center ${state.screen === 'leaderboard' ? 'text-[#7E4A00] font-bold' : 'text-[#6B6457]'}">
            <span>🏆</span><span>Boards</span>
          </button>
          <button type="button" onclick="setScreen('rewards')" class="min-h-11 flex flex-col items-center justify-center ${state.screen === 'rewards' ? 'text-[#B0412A] font-bold' : 'text-[#6B6457]'}">
            <span>🔥</span><span>Quests</span>
          </button>
        </nav>
      `;
    }

    function render() {
      ["setup", "play", "duel", "leaderboard", "rewards", "finish"].forEach(t => {
        const btn = document.getElementById("tab-" + t);
        if (!btn) return;
        if (state.screen === t) {
          btn.className = "px-2.5 py-1.5 rounded-full text-xs font-semibold transition bg-[#D8A33A] text-[#1D1B18]";
        } else {
          btn.className = "px-2.5 py-1.5 rounded-full text-xs font-semibold transition text-[#D9D0BF] hover:bg-[#2B2823]";
        }
      });

      const vpDesk = document.getElementById("vp-desktop");
      const vpMob = document.getElementById("vp-mobile");
      if (state.viewport === "desktop") {
        vpDesk.className = "px-3 py-1 rounded-full text-xs font-semibold transition bg-[#F4EFE4] text-[#1D1B18]";
        vpMob.className = "px-3 py-1 rounded-full text-xs font-semibold transition text-[#D9D0BF]";
      } else {
        vpMob.className = "px-3 py-1 rounded-full text-xs font-semibold transition bg-[#F4EFE4] text-[#1D1B18]";
        vpDesk.className = "px-3 py-1 rounded-full text-xs font-semibold transition text-[#D9D0BF]";
      }

      const isMobile = state.viewport === "mobile";
      const surface = document.getElementById("app-surface");
      if (isMobile) {
        surface.className = "mx-auto w-[414px] rounded-[48px] bg-[#1D1B18] p-[12px] shadow-2xl";
      } else {
        surface.className = "ism-paper mx-auto max-w-[1240px] rounded-2xl border border-[#DCD3C2] shadow-sm overflow-hidden";
      }

      let bodyContent = "";
      if (state.screen === "setup") bodyContent = renderSetupScreen(isMobile);
      else if (state.screen === "play") bodyContent = renderPlayScreen(isMobile);
      else if (state.screen === "duel") bodyContent = renderDuelScreen(isMobile);
      else if (state.screen === "leaderboard") bodyContent = renderLeaderboardScreen(isMobile);
      else if (state.screen === "rewards") bodyContent = renderRewardsScreen(isMobile);
      else bodyContent = renderFinishScreen(isMobile);

      if (isMobile) {
        surface.innerHTML = `
          <div class="ism-paper w-[390px] h-[844px] rounded-[38px] overflow-y-auto flex flex-col justify-between relative">
            <div>
              ${renderAppShellHeader(true)}
              ${bodyContent}
            </div>
            ${renderMobileBottomBar()}
          </div>
        `;
      } else {
        surface.innerHTML = `
          ${renderAppShellHeader(false)}
          ${bodyContent}
        `;
      }
    }

    // Initialize prototype
    render();
  </script>
</body>
</html>
