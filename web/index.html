<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finna</title>
    <link
      rel="preload"
      href="/fonts/figtree-latin-wght.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      try {
        document.documentElement.setAttribute('data-design', 'finna');
        var t = localStorage.getItem('ism-study-theme-v2');
        if (!t) {
          var legacy = localStorage.getItem('ism-study-theme');
          t = legacy === 'night' ? 'night' : 'library';
        }
        if (t !== 'library' && t !== 'paper' && t !== 'night') t = 'library';
        document.documentElement.setAttribute('data-theme', t);
        if (t === 'night') document.documentElement.classList.add('dark');
        var bg = localStorage.getItem('ism-study-bg') || 'library';
        document.documentElement.setAttribute('data-bg', bg);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
